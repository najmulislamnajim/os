<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অপারেটিং সিস্টেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12100e;--paper:#f5f1e8;--paper2:#ece5d6;--paper3:#e5ddca;--line:#d6ccb6;--accent:#7a4a1e;--accent2:#b8501f;--teal:#1a6b5a;--blue:#25608f;--plum:#6a3d7a;--green:#3d6b2f;--muted:#6a6152;--code-bg:#1a1613;--code-ink:#e9e3d5}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:18px;line-height:1.82}
  code,pre,.mono{font-family:'JetBrains Mono',monospace}
  .wrap{display:flex;min-height:100vh}
  aside{width:290px;flex-shrink:0;background:var(--paper2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px}
  main{flex:1;max-width:900px;margin:0 auto;padding:50px 50px 130px}
  aside .brand{font-weight:700;font-size:1.02rem;line-height:1.35;color:var(--accent)}
  aside .brand small{display:block;font-weight:400;font-size:.66rem;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:7px}
  aside nav{margin-top:20px}
  aside nav a{display:block;text-decoration:none;color:var(--ink);padding:6px 11px;border-radius:7px;font-size:.87rem;margin-bottom:1px}
  aside nav a .n{color:var(--accent);font-weight:600;font-family:'JetBrains Mono';font-size:.73rem;margin-right:7px}
  aside nav a:hover{background:var(--paper)}
  aside nav a.active{background:var(--accent);color:#fff}
  aside nav a.active .n{color:#e8c9a8}
  aside .modtag{font-size:.67rem;background:var(--accent2);color:#fff;padding:2px 9px;border-radius:20px;letter-spacing:.07em;display:inline-block;margin-top:13px}
  .hero{border-bottom:2px solid var(--ink);padding-bottom:30px;margin-bottom:44px}
  .hero .eyebrow{font-family:'JetBrains Mono';font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);margin-bottom:15px}
  .hero h1{font-size:2.85rem;line-height:1.08;margin:0 0 15px;font-weight:700;letter-spacing:-.6px}
  .hero p{font-size:1.1rem;color:var(--muted);max-width:60ch;margin:0}
  section.blk{margin-bottom:70px;scroll-margin-top:20px}
  .blk-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:26px}
  .blk-head .bn{font-family:'JetBrains Mono';font-size:2rem;font-weight:600;color:var(--accent);line-height:1}
  .blk-head h2{font-size:1.7rem;margin:0;font-weight:700;letter-spacing:-.3px}
  .blk-head .bs{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono'}
  h3{font-size:1.24rem;margin:34px 0 12px;font-weight:600}
  h4{font-size:1.02rem;margin:22px 0 8px;font-weight:600;color:var(--accent)}
  p{margin:12px 0}
  .lead{font-size:1.04rem}
  .box{border-radius:12px;padding:16px 20px;margin:20px 0;font-size:.95rem;line-height:1.72}
  .why{background:#fbf0e2;border:1px solid #e6c99f}
  .why .tag{font-weight:700;color:var(--accent2);font-size:.79rem;display:block;margin-bottom:5px}
  .note{background:#e7f1ee;border:1px solid #b2d4ca}
  .note .tag{font-weight:700;color:var(--teal);font-size:.79rem;display:block;margin-bottom:5px}
  .res{background:#e6eef5;border:1px solid #adc9dc}
  .res .tag{font-weight:700;color:var(--blue);font-size:.79rem;display:block;margin-bottom:5px}
  .warn{background:#fceadf;border:1px solid #ecbb9d}
  .warn .tag{font-weight:700;color:var(--accent2);font-size:.79rem;display:block;margin-bottom:5px}
  .lab{background:#eaf1e4;border:1px solid #b6cfa2}
  .lab .tag{font-weight:700;color:var(--green);font-size:.79rem;display:block;margin-bottom:5px}
  pre{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:.81rem;line-height:1.6;margin:16px 0}
  pre .c{color:#8a9b8f}
  pre .k{color:#e0b080}
  p code,li code,td code{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.83em;color:var(--accent2)}
  table{width:100%;border-collapse:collapse;margin:20px 0;font-size:.88rem}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--paper2);font-weight:600;font-size:.82rem}
  tr:hover td{background:#fff8ee}
  figure{margin:26px 0}
  .diagram{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
  figcaption{font-size:.82rem;color:var(--muted);text-align:center;margin-top:10px;font-style:italic}
  svg{max-width:100%;height:auto}
  ul,ol{padding-left:22px}
  li{margin:6px 0}
  .modcard{background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--mc,var(--accent));border-radius:12px;padding:20px 22px;margin:18px 0}
  .modcard .mc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .modcard .mc-num{font-family:'JetBrains Mono';font-size:1.5rem;font-weight:600;color:var(--mc,var(--accent))}
  .modcard h4{margin:0;font-size:1.14rem;color:var(--ink)}
  .modcard .mc-tag{font-size:.68rem;font-family:'JetBrains Mono';letter-spacing:.06em;background:var(--mc,var(--accent));color:#fff;padding:2px 9px;border-radius:20px;margin-left:auto}
  .modcard .topics{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .modcard .topics span{font-size:.76rem;background:var(--paper2);border:1px solid var(--line);padding:3px 10px;border-radius:6px;color:var(--ink)}
  .checklist{list-style:none;padding-left:0}
  .checklist li{padding-left:28px;position:relative;margin:8px 0}
  .checklist li::before{content:"▢";position:absolute;left:0;color:var(--accent);font-size:1.1rem}
  .toc-hint{color:var(--muted);font-size:.76rem;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
  @media(max-width:900px){aside{display:none}main{padding:28px 20px 90px}.hero h1{font-size:1.95rem}body{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
    <p>Najmul Islam Najim</p>
    <div class="box why" style="margin-top:40px;text-align:center;background:#fbf0e2;border-color:#7a4a1e">
      <a href="plan.html"><span class="tag" style="color:#7a4a1e">🚀 Plan</span></a>
      <strong>===============================> Comming Soon <===============================</strong>
    </div>
</div>
<script>
  const links=[...document.querySelectorAll('#toc a')];
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  const onScroll=()=>{let idx=0;secs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<=120)idx=i;});links.forEach(l=>l.classList.remove('active'));links[idx]&&links[idx].classList.add('active');};
  document.addEventListener('scroll',onScroll,{passive:true});onScroll();
</script>
</body>
</html>
